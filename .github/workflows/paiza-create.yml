name: PaizaCloud Auto-Create
on:
  workflow_dispatch:
jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private scripts repo
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: scripts-repo
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: 修复 apt 源
        run: |
          sudo tee /etc/apt/sources.list.d/ubuntu.sources > /dev/null <<'EOF'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu/
          Suites: noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo rm -f /etc/apt/apt-mirrors.txt

      - name: 开启 WARP
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client
      - name: 修复 DNS
        run: |
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo systemctl disable systemd-resolved 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          echo -e "nameserver 1.1.1.1\nnameserver 8.8.8.8\nnameserver 1.0.0.1" | sudo tee /etc/resolv.conf
          curl -s --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -E 'warp=|loc=' || true
      - name: 安装系统依赖
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          sudo apt-get update -qq $APT_OPTS
          sudo apt-get install -y -qq xvfb p7zip-full
          curl -L -o /tmp/ffmpeg.tar.xz https://github.com/akina005/akina/releases/download/ffmpeg/ffmpeg-release-amd64-static.tar.xz
          mkdir -p /tmp/ffmpeg-static
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-static --strip-components=1
          sudo ln -sf /tmp/ffmpeg-static/ffmpeg /usr/local/bin/ffmpeg
          sudo ln -sf /tmp/ffmpeg-static/ffprobe /usr/local/bin/ffprobe
          ffmpeg -version
          # noble 已移除 apt-key，改用 keyring 方式；Chrome 源改 https
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq $APT_OPTS
          sudo apt-get install -y -qq google-chrome-stable
      - name: 安装 Python 依赖
        run: |
          pip install selenium requests SpeechRecognition pydub chromedriver-autoinstaller paramiko
          sudo rm -f /usr/bin/chromedriver /usr/local/bin/chromedriver
          DRIVER_PATH=$(python -c "import chromedriver_autoinstaller; print(chromedriver_autoinstaller.install())")
          sudo ln -sf "$DRIVER_PATH" /usr/local/bin/chromedriver
          chromedriver --version
          google-chrome --version
          sudo apt-get install -y -qq -o Acquire::Retries=3 sshpass
      - name: 执行脚本
        env:
          TG_BOT: ${{ secrets.TG_BOT }}
          NEZHA_SERVER: ${{ secrets.NEZHA_SERVER }}
          NEZHA_KEY: ${{ secrets.NEZHA_KEY }}
          NZ_UUID: ${{ secrets.NZ_UUID }}
          ARGO_DOMAIN: ${{ secrets.ARGO_DOMAIN }}
          ARGO_AUTH: ${{ secrets.ARGO_AUTH }}
          PAIZA_JWT: ${{ secrets.PAIZA_JWT }}
          VPS: ${{ secrets.VPS }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python scripts-repo/scripts/paiza/paiza_create.py
      - name: 上传调试截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "screenshots/*.png"
      - name: 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 6
