name: PaizaCloud Ensure
on:
  workflow_dispatch:
    inputs:
      force_create:
        description: 强制重建容器
        required: false
        default: 'false'
concurrency:
  group: paiza-ensure
  cancel-in-progress: false
jobs:
  ensure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout private scripts repo
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: scripts-repo
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: 判定需要做什么
        id: decide
        env:
          PAIZA_JWT: ${{ secrets.PAIZA_JWT }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          FORCE_CREATE: ${{ github.event.inputs.force_create }}
        run: python scripts-repo/scripts/paiza/paiza_ensure.py --check >> "$GITHUB_OUTPUT"
      - name: 判定结果
        run: echo "action=${{ steps.decide.outputs.action }} reason=${{ steps.decide.outputs.reason }}"
      - name: 准备依赖
        if: steps.decide.outputs.action != 'CREATE'
        run: pip install --quiet paramiko
      - name: 准备 SSH 私钥
        env:
          PAIZA_SSH_KEY: ${{ secrets.PAIZA_SSH_KEY }}
        run: |
          mkdir -p "$HOME/.paiza"
          printf '%s\n' "$PAIZA_SSH_KEY" > "$HOME/.paiza/paiza_key"
          chmod 600 "$HOME/.paiza/paiza_key"
          echo "PAIZA_SSH_KEY_PATH=$HOME/.paiza/paiza_key" >> "$GITHUB_ENV"
      - name: 执行
        env:
          PAIZA_JWT: ${{ secrets.PAIZA_JWT }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          TG_BOT: ${{ secrets.TG_BOT }}
          ACTION: ${{ steps.decide.outputs.action }}
          REASON: ${{ steps.decide.outputs.reason }}
        run: python scripts-repo/scripts/paiza/paiza_ensure.py --apply
      - name: 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 1
